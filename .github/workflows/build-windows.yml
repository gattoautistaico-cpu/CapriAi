name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: npm install
        run: npm install

      - name: Tauri build (NSIS)
        run: npm run tauri build

      - name: Raccogli artefatti
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Copy-Item src-tauri/target/release/cyber-ai.exe release/CyberAI-portable.exe
          Copy-Item install.bat, scripts/setup.ps1 release/

      - uses: actions/upload-artifact@v4
        with:
          name: CyberAI-windows
          path: release/

      - name: Release (solo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Cyber AI ${{ github.ref_name }}
          body: |
            Windows x64: installer NSIS (`Cyber AI_*_x64-setup.exe`) oppure eseguibile portable (`CyberAI-portable.exe`). `install.bat` installa Ollama, whisper e Piper.
            Windows x64: NSIS installer (`Cyber AI_*_x64-setup.exe`) or portable executable (`CyberAI-portable.exe`). `install.bat` installs Ollama, whisper and Piper.
          files: release/*
